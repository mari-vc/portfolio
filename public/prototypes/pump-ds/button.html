<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* primitivos neutral, derivados na matiz da marca (h=27, c=0.009) */
    --neutral-0: #FFFFFF;
    --neutral-25: #FCFCFB;
    --neutral-50: #FAFAF9;
    --neutral-100: #EFEDEB;
    --neutral-200: #DEDBD7;
    --neutral-300: #BEB9B2;
    --neutral-400: #9E978E;
    --neutral-500: #837B70;
    --neutral-600: #6B655C;
    --neutral-800: #43403B;
    --neutral-900: #302E2A;

    /* primary do tenant Pump */
    --primary-50: #FEF3EE;
    --primary-500: #E2622A;
    --primary-600: #C4531F;
    --primary-700: #A34317;

    /* error: papel de feedback, derivado junto da marca (a matiz é resolvida
       a partir da primary pra não colidir com ela) */
    --error-500: #D01B0F;
    --error-600: #B80008;
    --error-700: #8C0000;

    /* semânticos — a única camada que o componente toca */
    --bg-primary: var(--neutral-0);
    --bg-secondary: var(--neutral-50);
    --bg-tertiary: var(--neutral-100);
    --bg-subtle: var(--neutral-25);
    --bg-brand-default: var(--primary-500);
    --bg-brand-hover: var(--primary-600);
    --bg-brand-active: var(--primary-700);
    --bg-disabled: var(--neutral-100);
    --fg-primary: var(--neutral-800);
    --fg-secondary: var(--neutral-600);
    --fg-tertiary: var(--neutral-500);
    --fg-brand-default: var(--primary-500);
    --fg-brand-on-primary: #FFFFFF;
    --fg-error-accent: var(--error-600);
    --border-default: var(--neutral-200);
    --border-subtle: var(--neutral-100);
    --border-strong: var(--neutral-300);
    --border-brand-default: var(--primary-500);
    --border-destructive: var(--error-500);

    --radius-md: 8px;
    --radius-lg: 12px;
    --height-sm: 32px;
    --height-md: 40px;
    --height-lg: 48px;
    --label-sm: 12px;
    --label-md: 14px;
    --weight-semibold: 600;
    --transition-fast: 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--fg-primary);
    -webkit-font-smoothing: antialiased;
  }
  @keyframes pump-spin { to { transform: rotate(360deg); } }
  #root { padding: 28px 28px 40px; }

  /* ── header ── */
  .hd { padding-bottom: 26px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 26px; }
  .hd-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .hd-title { font-size: 30px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; margin: 12px 0 0; }
  .hd-lede { font-size: 14px; line-height: 1.5; color: var(--fg-secondary); max-width: 620px; margin: 10px 0 0; }
  .copy-agent {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 7px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--border-default); background: var(--bg-default);
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em; color: var(--fg-secondary); cursor: pointer;
    transition: var(--transition-fast);
  }
  .copy-agent:hover { color: var(--fg-primary); border-color: var(--border-default); background: var(--bg-subtle); }
  .copy-agent.is-copied { color: #2E7D50; border-color: #2E7D50; }
  .copy-agent.is-failed { color: #A81208; border-color: #A81208; }

  /* ── section ── */
  .sec { margin-bottom: 34px; }
  .sec:last-child { margin-bottom: 0; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .sec-num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--fg-tertiary); letter-spacing: 0.08em; }
  .sec-h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sec-note { font-size: 12px; color: var(--fg-tertiary); margin: 0 0 15px; }

  /* ── anatomia ── */
  .an-frame {
    border: 1.5px dashed var(--border-default); border-radius: var(--radius-lg);
    padding: 22px 26px; background: var(--bg-subtle);
  }
  /* fluido: as colunas dos rótulos são fração da largura, então acompanham */
  .an-canvas { position: relative; width: 100%; max-width: 660px; margin: 0 auto; }
  /* 1:1, sem scale: o valor no rótulo é o valor medível na tela. Ampliar
     multiplicaria o raio e a altura sem multiplicar o texto do callout. */
  .an-scale { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .an-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .an-callout {
    position: absolute; width: 150px; margin-left: -75px; text-align: center;
    font-size: 10.5px; line-height: 1.45; color: var(--fg-tertiary);
  }
  .an-callout b {
    display: block; font-family: var(--font-mono); font-size: 10.5px;
    font-weight: 700; letter-spacing: 0.02em;
    color: var(--fg-primary); margin-bottom: 4px;
  }
  .an-callout span.tok {
    display: inline-block; font-family: var(--font-mono); font-size: 9.5px;
    color: var(--fg-brand-default); background: var(--primary-50);
    border-radius: 10px; padding: 3px 7px; letter-spacing: 0.01em;
    white-space: pre-line; line-height: 1.4;
  }
  .an-callout-top { top: 0; }
  .an-callout-bottom { bottom: 0; }

  /* estreito: o layout radial não cabe, então o botão fica em cima e as
     medidas viram lista de definição — sem linhas cruzando nem rótulo cortado */
  .an-canvas.is-stacked { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .an-canvas.is-stacked .an-scale {
    position: static; transform: none; margin: 20px 0 24px;
  }
  .an-list {
    width: 100%; margin: 0; display: grid;
    grid-template-columns: auto 1fr; gap: 7px 14px;
    font-size: 11.5px; line-height: 1.45;
  }
  .an-list dt {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    color: var(--fg-primary); white-space: nowrap;
  }
  .an-list dd { margin: 0; color: var(--fg-tertiary); }

  /* ── playground ── */
  .pg { display: grid; grid-template-columns: 1fr 232px; gap: 14px; }
  .pg-canvas {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    background: var(--bg-subtle);
    min-height: 178px; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(var(--neutral-200) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .pg-panel {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .pg-title {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
  }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl-label { font-size: 11px; font-weight: 500; color: var(--fg-secondary); }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button {
    padding: 4px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    background: var(--bg-primary); font-family: var(--font-sans); font-size: 11px;
    color: var(--fg-secondary); cursor: pointer; transition: var(--transition-fast);
  }
  .seg button:hover { border-color: var(--fg-tertiary); color: var(--fg-primary); }
  .seg button[aria-pressed="true"] {
    background: var(--fg-primary); border-color: var(--fg-primary); color: var(--bg-primary);
  }
  .ctrl input[type="text"] {
    padding: 6px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    font-family: var(--font-sans); font-size: 12px; color: var(--fg-primary);
    background: var(--bg-primary); outline: none; width: 100%;
  }
  .ctrl input[type="text"]:focus { border-color: var(--fg-primary); }

  /* ── matriz ── */
  .mx-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.mx { border-collapse: collapse; width: 100%; min-width: 480px; }
  table.mx th, table.mx td {
    padding: 13px 15px; text-align: left; border-bottom: 1px solid var(--border-subtle);
  }
  table.mx tr:last-child td { border-bottom: 0; }
  table.mx th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.mx td:first-child {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); white-space: nowrap;
  }

  /* ── tabelas de dados ── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.tbl { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 12px; }
  table.tbl th, table.tbl td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.tbl code { font-family: var(--font-mono); font-size: 11px; color: var(--fg-primary); }
  table.tbl td:last-child { color: var(--fg-secondary); }

  /* ── do / dont ── */
  .dd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dd-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px 16px; }
  .dd-do { background: color-mix(in oklch, #2E7D50 5%, var(--bg-default)); }
  .dd-dont { background: color-mix(in oklch, #A81208 5%, var(--bg-default)); }
  .dd-ex { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; padding: 12px; border-radius: var(--radius-md); background: var(--bg-default); border: 1px solid var(--border-subtle); }
  .dd-ex-label { font-size: 11px; color: var(--fg-tertiary); }
  .dd-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .dd-do .dd-head { color: #2E7D50; }
  .dd-dont .dd-head { color: #A81208; }
  .dd-mark { width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .dd-do .dd-mark { background: #E4F2E8; }
  .dd-dont .dd-mark { background: #FBE9E7; }
  .dd-card ul { margin: 0; padding-left: 17px; }
  .dd-card li { font-size: 12px; line-height: 1.5; color: var(--fg-secondary); margin: 4px 0; }

  .a11y { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 15px 17px; }
  .a11y ul { margin: 0; padding-left: 17px; }
  .a11y li { font-size: 12.5px; line-height: 1.55; color: var(--fg-secondary); margin: 5px 0; }
  .a11y b { color: var(--fg-primary); }
  code.i { font-family: var(--font-mono); font-size: 11px; background: var(--bg-secondary); padding: 1px 4px; border-radius: 3px; }

  @media (max-width: 520px) {
    .pg { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    #root { padding: 22px 18px 32px; }
    .dd { grid-template-columns: 1fr; }
    .hd-title { font-size: 25px; }
    .dd-ex { flex-wrap: wrap; }
  }
</style>

  <script type="text/markdown" id="agent-spec">
# Atelier · Button

**Component**

```tsx
import { Button } from "@/components/Button";
```

When implementing or refactoring UIs, always use this component for standard button actions.

---

## API

### tone

Defines semantic meaning.

| value | usage |
|--------|-------|
| brand | Primary actions and default CTAs |
| neutral | Secondary, low-emphasis or utility actions |
| destructive | Irreversible actions (delete, revoke, remove, ban) |
| inverse | Dark filled button for light backgrounds. Filled only. Ignore `appearance`. |

---

### appearance

Defines visual emphasis.

| value | usage |
|--------|-------|
| filled | Highest emphasis |
| outlined | Secondary emphasis |
| ghost | Lowest emphasis |

---

### size

| value | height |
|-------|--------|
| sm | 32px |
| md | 40px (default) |
| lg | 48px |

---

## Props

```tsx
isLoading?: boolean
icon?: ReactNode
iconPosition?: "leading" | "trailing"
disabled?: boolean
asChild?: boolean
```

---

# Required rules

These rules are mandatory.

### Primary hierarchy

Each form, modal or logical section MUST contain at most one:

```tsx
tone="brand"
appearance="filled"
```

If multiple actions exist:
Primary

```tsx
<Button
    tone="brand"
    appearance="filled"
/>
```

Secondary

```tsx
<Button
    tone="neutral"
    appearance="outlined"
/>
```

Tertiary

```tsx
<Button
    tone="neutral"
    appearance="ghost"
/>
```

---

### Semantic tone

Always choose `tone` based on meaning, never appearance.

Correct:
Delete → destructive
Save → brand
Cancel → neutral

---

### Navigation

Navigation MUST use `asChild`.

```tsx
<Button asChild>
    <Link ... />
</Button>
```

Never attach navigation handlers to a normal Button when a Link exists.

---

### Icon-only actions

Never use Button.

Always use IconButton.

Incorrect

```tsx
<Button icon={<Trash />} />
```

Correct

```tsx
<IconButton
    icon={<Trash />}
    aria-label="Delete"
/>
```

---

### Loading

Use `isLoading` while async work is running.

Never combine:

```
isLoading
disabled
```

`isLoading` already disables interaction.

---

### Responsive primary CTA

Primary actions SHOULD use

```tsx
className="w-full sm:w-auto"
```

unless the layout explicitly requires another width.

---

### Colors

Never hardcode colors.

Never style buttons with Tailwind color utilities.

Always rely on:
- tone
- appearance
- semantic tokens

---

### Labels

Prefer labels between one and three words.

Avoid labels longer than four words.

---

### Deprecated API

Never generate

```tsx
variant=""
```

Always use

```tsx
tone=""
appearance=""
```

---

# When refactoring

If an existing implementation:
- uses `variant`
- hardcodes colors
- has multiple primary buttons
- uses Button for icon-only actions
- manually renders loading spinners
- manually styles disabled state

refactor it to follow this specification.

---

# Generation priorities

When uncertain:
1. preserve semantic meaning
2. preserve accessibility
3. preserve hierarchy
4. preserve responsive behavior
5. follow this API over previous implementations

---

Tags
button, CTA, primary action, secondary action, loading, navigation, design system
