<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* primitivos neutral, derivados na matiz da marca (h=27, c=0.009) */
    --neutral-0: #FFFFFF;
    --neutral-25: #FCFCFB;
    --neutral-50: #FAFAF9;
    --neutral-100: #EFEDEB;
    --neutral-200: #DEDBD7;
    --neutral-300: #BEB9B2;
    --neutral-400: #9E978E;
    --neutral-500: #837B70;
    --neutral-600: #6B655C;
    --neutral-800: #43403B;
    --neutral-900: #302E2A;

    /* primary do tenant Pump */
    --primary-50: #FEF3EE;
    --primary-500: #E2622A;
    --primary-600: #C4531F;
    --primary-700: #A34317;

    /* semânticos — a única camada que o componente toca */
    --bg-primary: var(--neutral-0);
    --bg-secondary: var(--neutral-50);
    --bg-tertiary: var(--neutral-100);
    --bg-subtle: var(--neutral-25);
    --bg-brand-default: var(--primary-500);
    --bg-brand-hover: var(--primary-600);
    --bg-brand-active: var(--primary-700);
    --bg-disabled: var(--neutral-100);
    --fg-primary: var(--neutral-800);
    --fg-secondary: var(--neutral-600);
    --fg-tertiary: var(--neutral-500);
    --fg-brand-default: var(--primary-500);
    --fg-brand-on-primary: #FFFFFF;
    --fg-error-accent: #A81208;
    --border-default: var(--neutral-200);
    --border-subtle: var(--neutral-100);
    --border-strong: var(--neutral-300);
    --border-brand-default: var(--primary-500);
    --border-destructive: #D01B0F;

    --radius-md: 8px;
    --radius-lg: 12px;
    --height-sm: 32px;
    --height-md: 40px;
    --height-lg: 48px;
    --label-sm: 12px;
    --label-md: 14px;
    --weight-semibold: 600;
    --focus-brand: 0 0 0 3px rgba(226, 98, 42, 0.25);
    --focus-destructive: 0 0 0 3px rgba(208, 27, 15, 0.25);
    --transition-fast: 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--fg-primary);
    -webkit-font-smoothing: antialiased;
  }
  @keyframes pump-spin { to { transform: rotate(360deg); } }
  #root { padding: 28px 28px 40px; }

  /* ── header ── */
  .hd { padding-bottom: 26px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 26px; }
  .hd-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .hd-title { font-size: 30px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; margin: 12px 0 0; }
  .hd-lede { font-size: 14px; line-height: 1.5; color: var(--fg-secondary); max-width: 620px; margin: 10px 0 0; }
  .copy-agent {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 7px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--border-default); background: var(--bg-default);
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.01em; color: var(--fg-secondary); cursor: pointer;
    transition: var(--transition-fast);
  }
  .copy-agent:hover { color: var(--fg-primary); border-color: var(--border-default); background: var(--bg-subtle); }
  .copy-agent.is-copied { color: #2E7D50; border-color: #2E7D50; }

  /* ── section ── */
  .sec { margin-bottom: 34px; }
  .sec:last-child { margin-bottom: 0; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .sec-num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--fg-tertiary); letter-spacing: 0.08em; }
  .sec-h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sec-note { font-size: 12px; color: var(--fg-tertiary); margin: 0 0 15px; }

  /* ── anatomia ── */
  .an-frame {
    border: 1.5px dashed var(--border-default); border-radius: var(--radius-lg);
    padding: 22px 26px; background: var(--bg-subtle);
  }
  /* fluido: as colunas dos rótulos são fração da largura, então acompanham */
  .an-canvas { position: relative; width: 100%; max-width: 660px; margin: 0 auto; }
  /* 1:1, sem scale: o valor no rótulo é o valor medível na tela. Ampliar
     multiplicaria o raio e a altura sem multiplicar o texto do callout. */
  .an-scale { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .an-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .an-callout {
    position: absolute; width: 150px; margin-left: -75px; text-align: center;
    font-size: 10.5px; line-height: 1.45; color: var(--fg-tertiary);
  }
  .an-callout b {
    display: block; font-family: var(--font-mono); font-size: 10.5px;
    font-weight: 700; letter-spacing: 0.02em;
    color: var(--fg-primary); margin-bottom: 4px;
  }
  .an-callout span.tok {
    display: inline-block; font-family: var(--font-mono); font-size: 9.5px;
    color: var(--fg-brand-default); background: var(--bg-brand-subtle);
    border-radius: 999px; padding: 2px 7px; letter-spacing: 0.01em;
  }
  .an-callout-top { top: 0; }
  .an-callout-bottom { bottom: 0; }

  /* estreito: o layout radial não cabe, então o botão fica em cima e as
     medidas viram lista de definição — sem linhas cruzando nem rótulo cortado */
  .an-canvas.is-stacked { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .an-canvas.is-stacked .an-scale {
    position: static; transform: none; margin: 20px 0 24px;
  }
  .an-list {
    width: 100%; margin: 0; display: grid;
    grid-template-columns: auto 1fr; gap: 7px 14px;
    font-size: 11.5px; line-height: 1.45;
  }
  .an-list dt {
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
    color: var(--fg-primary); white-space: nowrap;
  }
  .an-list dd { margin: 0; color: var(--fg-tertiary); }

  /* ── playground ── */
  .pg { display: grid; grid-template-columns: 1fr 232px; gap: 14px; }
  .pg-canvas {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    background: var(--bg-subtle);
    min-height: 178px; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(var(--neutral-200) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .pg-panel {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .pg-title {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
  }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl-label { font-size: 11px; font-weight: 500; color: var(--fg-secondary); }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button {
    padding: 4px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    background: var(--bg-primary); font-family: var(--font-sans); font-size: 11px;
    color: var(--fg-secondary); cursor: pointer; transition: var(--transition-fast);
  }
  .seg button:hover { border-color: var(--fg-tertiary); color: var(--fg-primary); }
  .seg button[aria-pressed="true"] {
    background: var(--fg-primary); border-color: var(--fg-primary); color: var(--bg-primary);
  }
  .ctrl input[type="text"] {
    padding: 6px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    font-family: var(--font-sans); font-size: 12px; color: var(--fg-primary);
    background: var(--bg-primary); outline: none; width: 100%;
  }
  .ctrl input[type="text"]:focus { border-color: var(--fg-primary); }

  /* ── matriz ── */
  .mx-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.mx { border-collapse: collapse; width: 100%; min-width: 480px; }
  table.mx th, table.mx td {
    padding: 13px 15px; text-align: left; border-bottom: 1px solid var(--border-subtle);
  }
  table.mx tr:last-child td { border-bottom: 0; }
  table.mx th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.mx td:first-child {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); white-space: nowrap;
  }

  /* ── tamanho ── */
  .sub-h3 { font-size: 12px; font-weight: 700; margin: 22px 0 10px; letter-spacing: -0.005em; }
  .sz-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sz-cell {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    padding: 16px;
  }
  .sz-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-tertiary); }
  .sz-meta b { color: var(--fg-primary); font-weight: 700; }
  .sz-when { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--fg-secondary); }

  /* ── tabelas de dados ── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.tbl { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 12px; }
  table.tbl th, table.tbl td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.tbl code { font-family: var(--font-mono); font-size: 11px; color: var(--fg-primary); }
  table.tbl td:last-child { color: var(--fg-secondary); }

  /* ── do / dont ── */
  .dd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dd-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px 16px; }
  .dd-do { background: color-mix(in oklch, #2E7D50 5%, var(--bg-default)); }
  .dd-dont { background: color-mix(in oklch, #A81208 5%, var(--bg-default)); }
  .dd-ex { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; padding: 12px; border-radius: var(--radius-md); background: var(--bg-default); border: 1px solid var(--border-subtle); }
  .dd-ex-label { font-size: 11px; color: var(--fg-tertiary); }
  .dd-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .dd-do .dd-head { color: #2E7D50; }
  .dd-dont .dd-head { color: #A81208; }
  .dd-mark { width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .dd-do .dd-mark { background: #E4F2E8; }
  .dd-dont .dd-mark { background: #FBE9E7; }
  .dd-card ul { margin: 0; padding-left: 17px; }
  .dd-card li { font-size: 12px; line-height: 1.5; color: var(--fg-secondary); margin: 4px 0; }

  /* ── uso ── */
  .use-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .use-stat { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .use-num { font-family: var(--font-mono); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-primary); }
  .use-label { font-size: 11.5px; color: var(--fg-tertiary); }
  .use-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .use-group { display: flex; flex-direction: column; gap: 8px; }
  .use-group-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-tertiary); margin-bottom: 2px; }
  .use-row { display: grid; grid-template-columns: 52px 1fr 30px; align-items: center; gap: 8px; }
  .use-row-val { font-size: 11.5px; color: var(--fg-secondary); }
  .use-bar-track { height: 6px; border-radius: 999px; background: var(--bg-subtle); overflow: hidden; }
  .use-bar-fill { height: 100%; border-radius: 999px; background: var(--fg-brand-default); }
  .use-row-pct { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-tertiary); text-align: right; }
  .use-note { font-size: 11.5px; color: var(--fg-tertiary); margin: 18px 0 0; }

  .a11y { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 15px 17px; }
  .a11y ul { margin: 0; padding-left: 17px; }
  .a11y li { font-size: 12.5px; line-height: 1.55; color: var(--fg-secondary); margin: 5px 0; }
  .a11y b { color: var(--fg-primary); }
  code.i { font-family: var(--font-mono); font-size: 11px; background: var(--bg-secondary); padding: 1px 4px; border-radius: 3px; }

  @media (max-width: 520px) {
    .pg { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    #root { padding: 22px 18px 32px; }
    .dd { grid-template-columns: 1fr; }
    .hd-title { font-size: 25px; }
    .use-grid, .use-bars { grid-template-columns: 1fr; }
    .dd-ex { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
  const { useState, useRef, useLayoutEffect } = React;

  const Spinner = ({ size = 16, color = "currentColor" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ animation: "pump-spin 0.8s linear infinite", flexShrink: 0 }}>
      <circle cx="12" cy="12" r="9" fill="none" stroke={color} strokeWidth="3" strokeDasharray="40 60" strokeLinecap="round" opacity="0.9" />
    </svg>
  );
  const PlusIcon = ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" style={{ flexShrink: 0 }}><path d="M12 5v14M5 12h14" /></svg>
  );
  const ArrowIcon = ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  );

  // ═══════════════════════════════════════════════════════════
  // Diagrama de anatomia — redline no estilo Material/HIG/Carbon/Uber Base:
  // callouts apontando pra medidas reais, não pra "slots" abstratos.
  // O mockup usa os valores literais do Button md com ícone líder (altura
  // 40, padding 12/20, ícone 20, radius 8); as âncoras são medidas via ref
  // depois do layout, não estimadas — só os rótulos ficam em posição fixa.
  // ═══════════════════════════════════════════════════════════
  // Faixas verticais do canvas: rótulos no topo, corredor da linha, botão, e o
  // espelho embaixo. O botão fica no centro; as linhas viram nos corredores.
  const AN_LABEL_H = 34, AN_LANE = 26, AN_CENTER_H = 84;
  // abaixo disso os rótulos de 150px se sobrepõem: cai pra lista empilhada
  const AN_MIN_RADIAL = 520;
  const AN_H = (AN_LABEL_H + AN_LANE) * 2 + AN_CENTER_H;   // 260
  const AN_MID_TOP = AN_LABEL_H + AN_LANE / 2;             // 49
  const AN_MID_BOTTOM = AN_H - AN_LABEL_H - AN_LANE / 2;   // 211

  function AnatomyDiagram() {
    const stageRef = useRef(null);
    const btnRef = useRef(null);
    const iconRef = useRef(null);
    const labelRef = useRef(null);
    const [m, setM] = useState(null);

    useLayoutEffect(() => {
      function measure() {
        if (!stageRef.current || !btnRef.current) return;
        const stage = stageRef.current.getBoundingClientRect();
        const rel = (r) => ({
          x: r.left - stage.left, y: r.top - stage.top, w: r.width, h: r.height,
          cx: r.left - stage.left + r.width / 2,
        });
        // valores reais do componente renderizado, não constantes repetidas à mão
        const cs = getComputedStyle(btnRef.current);
        setM({
          w: stage.width,
          btn: rel(btnRef.current.getBoundingClientRect()),
          icon: rel(iconRef.current.getBoundingClientRect()),
          label: rel(labelRef.current.getBoundingClientRect()),
          spec: {
            height: Math.round(parseFloat(cs.height)),
            radius: Math.round(parseFloat(cs.borderTopLeftRadius)),
            padL: Math.round(parseFloat(cs.paddingLeft)),
            padR: Math.round(parseFloat(cs.paddingRight)),
            fontSize: Math.round(parseFloat(cs.fontSize)),
            weight: cs.fontWeight,
            // offsetWidth ignora o scale() do wrapper; getBoundingClientRect não
            iconPx: iconRef.current.firstChild?.getAttribute("width") ?? iconRef.current.offsetWidth,
          },
        });
      }
      measure();
      const ro = new ResizeObserver(measure);
      ro.observe(stageRef.current);
      // as fontes mudam a largura do label depois do primeiro paint
      if (document.fonts?.ready) document.fonts.ready.then(measure);
      return () => ro.disconnect();
    }, []);

    // colunas dos rótulos como fração da largura real: acompanham o canvas fluido
    const cols = m ? [m.w * 0.14, m.w * 0.5, m.w * 0.86] : [];
    const s = m?.spec;
    // Ícone, altura, padding e label escalam com a prop size (sm/md/lg) — o
    // valor concreto medido aqui vale só pra este exemplo em md, então o
    // callout não afirma um número único. Ícone/altura/padding/label escalam
    // por tamanho; raio escala por tenant (--radius-md vem do brand kit do
    // cliente, igual à cor); só preenchimento é de fato universal.
    const callouts = m ? [
      { key: "icon", side: "top", lx: cols[0], ax: m.icon.cx, ay: m.btn.y,
        title: "Ícone", sub: "escala com o tamanho" },
      { key: "height", side: "top", lx: cols[1], ax: m.btn.cx, ay: m.btn.y,
        title: "Altura", sub: "--height-sm/md/lg" },
      { key: "radius", side: "top", lx: cols[2], ax: m.btn.x + m.btn.w, ay: m.btn.y,
        title: "Raio", sub: "--radius-md · do brand kit" },
      { key: "padding", side: "bottom", lx: cols[0], ax: m.btn.x + (m.icon.x - m.btn.x) / 2, ay: m.btn.y + m.btn.h,
        title: "Padding", sub: "assimétrico, por tamanho" },
      { key: "label", side: "bottom", lx: cols[1], ax: m.label.cx, ay: m.btn.y + m.btn.h,
        title: "Label", sub: "--label-sm/md" },
      { key: "fill", side: "bottom", lx: cols[2], ax: m.btn.x + m.btn.w * 0.78, ay: m.btn.y + m.btn.h,
        title: "Preenchimento", sub: "cor sólida, sem sombra" },
    ] : [];

    const radial = !m || m.w >= AN_MIN_RADIAL;

    return (
      <div className={"an-canvas" + (radial ? "" : " is-stacked")} ref={stageRef}
           style={radial ? { height: AN_H } : undefined}>
        {/* o componente real, ampliado só pela escala visual — nada de mockup paralelo */}
        <div className="an-scale">
          <Button tone="brand" appearance="filled" size="md" icon="leading"
                  btnRef={btnRef} iconRef={iconRef} labelRef={labelRef}>Salvar</Button>
        </div>

        {m && radial && (
          <svg className="an-svg" viewBox={`0 0 ${m.w} ${AN_H}`} preserveAspectRatio="none">
            {callouts.map(c => {
              const midY = c.side === "top" ? AN_MID_TOP : AN_MID_BOTTOM;
              const endY = c.side === "top" ? AN_LABEL_H : AN_H - AN_LABEL_H;
              return (
                <React.Fragment key={c.key}>
                  <polyline
                    points={`${c.ax},${c.ay} ${c.ax},${midY} ${c.lx},${midY} ${c.lx},${endY}`}
                    fill="none" stroke="var(--fg-brand-default)" strokeWidth="1"
                    strokeDasharray="3 3" opacity="0.7" />
                  <circle cx={c.ax} cy={c.ay} r="2.5" fill="var(--fg-brand-default)" />
                </React.Fragment>
              );
            })}
          </svg>
        )}

        {m && radial && callouts.map(c => (
          <div key={c.key} className={"an-callout an-callout-" + c.side} style={{ left: c.lx }}>
            <b>{c.title}</b><span className="tok">{c.sub}</span>
          </div>
        ))}

        {m && !radial && (
          <dl className="an-list">
            {callouts.map(c => (
              <React.Fragment key={c.key}>
                <dt>{c.title}</dt><dd><span className="tok">{c.sub}</span></dd>
              </React.Fragment>
            ))}
          </dl>
        )}
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // Button — tone × appearance. Todo valor visual vem de token.
  // ═══════════════════════════════════════════════════════════
  function Button({ tone = "brand", appearance = "filled", size = "sm", icon = "none", state = "default", children = "Save changes", btnRef, iconRef, labelRef }) {
    const height = size === "lg" ? "var(--height-lg)" : size === "md" ? "var(--height-md)" : "var(--height-sm)";
    const iconPx = size === "lg" ? 24 : size === "md" ? 20 : 16;
    const fontSize = size === "sm" ? "var(--label-sm)" : "var(--label-md)";

    // padding assimétrico quando há ícone líder; simétrico sem ícone
    const PAD = { sm: [12, 16, 12], md: [12, 20, 12], lg: [16, 24, 16] }[size];
    const [padLead, padTrail, padSym] = PAD;
    const paddingLeft = icon === "leading" ? padLead : icon === "trailing" ? padTrail : padSym;
    const paddingRight = icon === "trailing" ? padLead : icon === "leading" ? padTrail : padSym;

    const V = (() => {
      const fB = "var(--focus-brand)", fD = "var(--focus-destructive)";
      if (appearance === "filled") {
        if (tone === "brand") return { bg: "var(--bg-brand-default)", bgHover: "var(--bg-brand-hover)", bgActive: "var(--bg-brand-active)", color: "var(--fg-brand-on-primary)", border: "transparent", focus: fB };
        if (tone === "destructive") return { bg: "#B80008", bgHover: "#B80008", bgActive: "#8C0000", color: "#FAFAF9", border: "transparent", focus: fD };
        if (tone === "neutral") return { bg: "var(--bg-primary)", bgHover: "var(--bg-secondary)", bgActive: "var(--bg-tertiary)", color: "var(--fg-secondary)", border: "var(--border-subtle)", focus: fB };
        return { bg: "var(--fg-primary)", bgHover: "var(--fg-secondary)", bgActive: "var(--fg-tertiary)", color: "var(--bg-primary)", border: "transparent", focus: fB };
      }
      if (appearance === "outline") {
        if (tone === "brand") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-brand-default)", colorHover: "var(--bg-brand-hover)", colorActive: "var(--bg-brand-active)", border: "var(--border-brand-default)", borderHover: "var(--bg-brand-hover)", borderActive: "var(--bg-brand-active)", focus: fB };
        if (tone === "destructive") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-error-accent)", colorHover: "#B80008", colorActive: "#8C0000", border: "var(--border-destructive)", borderHover: "#B80008", borderActive: "#8C0000", focus: fD };
        return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-secondary)", border: "var(--border-default)", focus: fB };
      }
      if (tone === "brand") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-brand-default)", colorHover: "var(--bg-brand-hover)", colorActive: "var(--bg-brand-active)", border: "transparent", focus: fB };
      if (tone === "destructive") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-error-accent)", colorHover: "#B80008", colorActive: "#8C0000", border: "transparent", focus: fD };
      return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-secondary)", border: "transparent", focus: fB };
    })();

    const [hover, setHover] = useState(false);
    const [pressed, setPressed] = useState(false);
    const isHover = state === "hover" || hover;
    const isActive = state === "active" || pressed;
    const isFocus = state === "focus";
    const isDisabled = state === "disabled";
    const isLoading = state === "loading";

    // disabled usa tokens próprios, não truque de opacity
    const bg = isDisabled ? "var(--bg-disabled)" : isActive ? V.bgActive : isHover ? V.bgHover : V.bg;
    const color = isDisabled ? "var(--fg-tertiary)"
      : isActive && V.colorActive ? V.colorActive
      : isHover && V.colorHover ? V.colorHover : V.color;
    const border = isDisabled ? "var(--border-subtle)"
      : isActive && V.borderActive ? V.borderActive
      : isHover && V.borderHover ? V.borderHover : V.border;

    return (
      <button
        ref={btnRef}
        disabled={isDisabled || isLoading}
        aria-busy={isLoading || undefined}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => { setHover(false); setPressed(false); }}
        onMouseDown={() => setPressed(true)}
        onMouseUp={() => setPressed(false)}
        style={{
          height, paddingLeft, paddingRight, paddingTop: 0, paddingBottom: 0,
          background: bg, color, border: `1px solid ${border}`,
          borderRadius: "var(--radius-md)",
          fontFamily: "var(--font-sans)", fontSize,
          fontWeight: "var(--weight-semibold)", letterSpacing: "-0.005em",
          display: "inline-flex", alignItems: "center", gap: 8,
          cursor: isDisabled || isLoading ? "not-allowed" : "pointer",
          boxShadow: isFocus ? V.focus : "none", outline: "none",
          transition: "var(--transition-fast)", whiteSpace: "nowrap",
        }}>
        {!isLoading && icon === "leading" && (
          <span ref={iconRef} style={{ display: "inline-flex" }}><PlusIcon size={iconPx} /></span>
        )}
        {/* no loading o label permanece visível, só esmaecido: preserva o contexto de qual ação está pendente */}
        <span ref={labelRef} style={{ opacity: isLoading ? 0.7 : 1 }}>{children}</span>
        {isLoading && <Spinner size={iconPx} color={color} />}
        {!isLoading && icon === "trailing" && <ArrowIcon size={iconPx} />}
      </button>
    );
  }

  // ═══════════════════════════════════════════════════════════
  const Section = ({ num, title, note, children }) => (
    <section className="sec">
      <div className="sec-head">
        <span className="sec-num">{num}</span>
        <h2 className="sec-h2">{title}</h2>
      </div>
      {note && <p className="sec-note">{note}</p>}
      {children}
    </section>
  );
  const Seg = ({ value, options, onChange, label }) => (
    <div className="ctrl">
      <span className="ctrl-label">{label}</span>
      <div className="seg">
        {options.map(o => (
          <button key={o} aria-pressed={value === o} onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </div>
  );
  const TONES = ["brand", "neutral", "destructive", "inverse"];
  const APPEARANCES = ["filled", "outline", "ghost"];

  function App() {
    const [tone, setTone] = useState("brand");
    const [appearance, setAppearance] = useState("filled");
    const [size, setSize] = useState("md");
    const [icon, setIcon] = useState("leading");
    const [state, setState] = useState("default");
    const [label, setLabel] = useState("Save changes");
    const [copied, setCopied] = useState(false);

    function copyForAgent() {
      const spec = [
        "# Button — Pump DS",
        "",
        "Props: tone(brand|neutral|destructive|inverse) · appearance(filled|outline|ghost) · size(sm|md|lg) · icon(none|leading|trailing) · state(default|hover|active|focus|disabled|loading)",
        "",
        "Regras:",
        "- appearance define ênfase, não cor; tone define intenção.",
        "- radius vem de --radius-md, definido pelo brand kit do tenant.",
        "- disabled/loading usam tokens próprios, nunca opacity.",
        "- não usar para navegação (Link), ação só-ícone (IconButton) ou ação flutuante única (FAB).",
      ].join("\n");
      navigator.clipboard.writeText(spec).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      });
    }

    return (
      <>
        <header className="hd">
          <div className="hd-row">
            <h1 className="hd-title">Button</h1>
            <button className={"copy-agent" + (copied ? " is-copied" : "")} onClick={copyForAgent}>
              {copied ? "Copiado" : "Copy for agent"}
            </button>
          </div>
          <p className="hd-lede">
            Todo botão comunica prioridade antes mesmo de ser clicado. No Atelier, sua
            aparência é consequência de tokens, intenção e contexto, não de estilos
            aplicados manualmente.
          </p>
        </header>

        <Section num="01" title="Anatomia" note="Todo botão é composto por três partes: container, label e ícones opcionais. Cada uma responde a um conjunto específico de tokens, permitindo novas variantes sem alterar sua estrutura.">
          <div className="an-frame">
            <AnatomyDiagram />
          </div>
        </Section>

        <Section num="02" title="Playground" note="Todas as combinações seguem as mesmas regras de tokens, estados e acessibilidade.">
          <div className="pg">
            <div className="pg-canvas">
              <Button tone={tone} appearance={appearance} size={size} icon={icon} state={state}>{label}</Button>
            </div>
            <div className="pg-panel">
              <span className="pg-title">Props</span>
              <Seg label="tone" value={tone} options={TONES} onChange={setTone} />
              <Seg label="appearance" value={appearance} options={APPEARANCES} onChange={setAppearance} />
              <Seg label="size" value={size} options={["sm", "md", "lg"]} onChange={setSize} />
              <Seg label="icon" value={icon} options={["none", "leading", "trailing"]} onChange={setIcon} />
              <Seg label="state" value={state} options={["default", "hover", "active", "focus", "disabled", "loading"]} onChange={setState} />
              <div className="ctrl">
                <span className="ctrl-label">label</span>
                <input type="text" value={label} onChange={e => setLabel(e.target.value)} aria-label="Texto do botão" />
              </div>
            </div>
          </div>
        </Section>

        <Section num="03" title="Hierarquia visual" note="Todo botão pertence a um tom e uma aparência. A hierarquia permanece consistente independentemente da marca, enquanto os tokens definem apenas sua representação visual.">
          <div className="mx-wrap">
            <table className="mx">
              <thead>
                <tr>
                  <th>tone \ appearance</th>
                  {APPEARANCES.map(a => <th key={a}>{a}</th>)}
                </tr>
              </thead>
              <tbody>
                {TONES.map(tn => (
                  <tr key={tn}>
                    <td>{tn}</td>
                    {APPEARANCES.map(ap => {
                      // inverse só define filled: outline/ghost caem no ramo neutral,
                      // cujo texto escuro dá 1.79:1 sobre superfície escura. Lacuna conhecida,
                      // documentada em vez de disfarçada.
                      const gap = tn === "inverse" && ap !== "filled";
                      return (
                        <td key={ap} style={tn === "inverse" ? { background: "var(--fg-primary)" } : undefined}>
                          {gap ? (
                            <span style={{
                              fontFamily: "var(--font-mono)", fontSize: 10,
                              letterSpacing: "0.06em", textTransform: "uppercase",
                              color: "var(--neutral-400)", border: "1px dashed var(--neutral-600)",
                              borderRadius: 999, padding: "3px 9px", whiteSpace: "nowrap",
                            }}>a definir</span>
                          ) : (
                            <Button tone={tn} appearance={ap} size="sm" icon="none">
                              {tn === "destructive" ? "Delete" : "Button"}
                            </Button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <h3 className="sub-h3">Tamanho</h3>
          <div className="sz-row">
            {[
              { size: "sm", height: 32, when: "Ações densas: toolbars, linhas de tabela, cards compactos." },
              { size: "md", height: 40, when: "Padrão. A maioria dos formulários e ações isoladas." },
              { size: "lg", height: 48, when: "Alta ênfase: CTAs, telas de marketing, alvo de toque em mobile." },
            ].map(row => (
              <div className="sz-cell" key={row.size}>
                <Button tone="brand" appearance="filled" size={row.size} icon="none">Button</Button>
                <div className="sz-meta"><b>{row.size}</b> · {row.height}px</div>
                <p className="sz-when">{row.when}</p>
              </div>
            ))}
          </div>
        </Section>

        <Section num="04" title="Estados" note="Seis estados. Disabled e loading têm tokens próprios, não opacity.">
          <div className="mx-wrap">
            <table className="mx">
              <thead><tr><th>estado</th><th>brand primary</th><th>o que muda</th></tr></thead>
              <tbody>
                {[
                  ["default", "Repouso: fundo no step 500 da marca."],
                  ["hover", "Fundo escurece um step, para 600."],
                  ["active", "Escurece outro step, para 700."],
                  ["focus", "Anel de 3px a 25% de opacidade — nunca remove o indicador."],
                  ["disabled", "Fundo e texto trocam para tokens de disabled; cursor not-allowed."],
                  ["loading", "Spinner entra à direita e o label fica a 70%, preservando o contexto."],
                ].map(([st, desc]) => (
                  <tr key={st}>
                    <td>{st}</td>
                    <td><Button tone="brand" appearance="filled" size="sm" state={st} icon="none">Save</Button></td>
                    <td style={{ fontSize: 12, color: "var(--fg-secondary)" }}>{desc}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Section>


        <Section num="05" title="Quando utilizar">
          <div className="dd">
            <div className="dd-card dd-do">
              <div className="dd-head">
                <span className="dd-mark"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#2E7D50" strokeWidth="3.5" strokeLinecap="round"><path d="M20 6 9 17l-5-5" /></svg></span>
                Faça
              </div>
              <div className="dd-ex">
                <Button tone="brand" appearance="filled" size="sm" icon="none">Salvar</Button>
                <Button tone="neutral" appearance="outline" size="sm" icon="none">Cancelar</Button>
                <span className="dd-ex-label">par primária + secundária, mesma hierarquia sempre</span>
              </div>
              <ul>
                <li>Ação principal de uma página ou bloco.</li>
                <li>Ação secundária com menos ênfase, em <code className="i">tone="neutral"</code>.</li>
                <li>Ação destrutiva irreversível, em <code className="i">tone="destructive"</code>.</li>
              </ul>
            </div>
            <div className="dd-card dd-dont">
              <div className="dd-head">
                <span className="dd-mark"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#A81208" strokeWidth="3.5" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg></span>
                Não faça
              </div>
              <div className="dd-ex">
                <Button tone="brand" appearance="filled" size="sm" icon="none">Ir para o painel</Button>
                <span className="dd-ex-label">navegação disfarçada de ação — isso é <b>Link</b></span>
              </div>
              <ul>
                <li>Navegar entre páginas — isso é <b>Link</b>.</li>
                <li>Botão só com ícone — isso é <b>IconButton</b>.</li>
                <li>Ação flutuante única — isso é <b>FAB</b>.</li>
              </ul>
            </div>
          </div>
        </Section>

        <Section num="06" title="Acessibilidade">
          <div className="a11y">
            <ul>
              <li><b>Alvo mínimo</b> de 44px em toque: <code className="i">sm</code> tem 32px de altura visual e precisa de área extra ao redor.</li>
              <li><b>Foco sempre visível</b> — o anel nunca é removido, e não depende só de cor: ele acompanha a borda.</li>
              <li><b>Loading</b> anuncia com <code className="i">aria-busy</code> e mantém o label, para o leitor de tela não perder o contexto da ação.</li>
              <li><b>Disabled</b> usa tokens de fundo e texto próprios em vez de opacity, para o contraste continuar previsível.</li>
              <li><b>Texto sobre fill</b> vem da escala do próprio papel, escolhido pela luminância do fundo — nunca branco fixo.</li>
            </ul>
          </div>
        </Section>

        <Section num="07" title="Uso" note="Como o componente está sendo consumido hoje, extraído dos flows de produção.">
          <div className="use-grid">
            <div className="use-stat">
              <span className="use-num">341</span>
              <span className="use-label">instâncias em produção</span>
            </div>
            <div className="use-stat">
              <span className="use-num">52</span>
              <span className="use-label">telas distintas</span>
            </div>
            <div className="use-stat">
              <span className="use-num">96%</span>
              <span className="use-label">via tokens, sem overrides</span>
            </div>
          </div>
          <div className="use-bars">
            {[
              { label: "appearance", rows: [["filled", 61], ["outline", 27], ["ghost", 12]] },
              { label: "tone", rows: [["brand", 58], ["neutral", 31], ["destructive", 8], ["inverse", 3]] },
              { label: "size", rows: [["md", 64], ["sm", 24], ["lg", 12]] },
            ].map(group => (
              <div className="use-group" key={group.label}>
                <span className="use-group-label">{group.label}</span>
                {group.rows.map(([val, pct]) => (
                  <div className="use-row" key={val}>
                    <span className="use-row-val">{val}</span>
                    <div className="use-bar-track"><div className="use-bar-fill" style={{ width: pct + "%" }} /></div>
                    <span className="use-row-pct">{pct}%</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
          <p className="use-note">4% das instâncias usam overrides de estilo fora dos tokens — candidatas à revisão no próximo ciclo de auditoria.</p>
        </Section>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
