<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* primitivos neutral, derivados na matiz da marca (h=27, c=0.009) */
    --neutral-0: #FFFFFF;
    --neutral-25: #FCFCFB;
    --neutral-50: #FAFAF9;
    --neutral-100: #EFEDEB;
    --neutral-200: #DEDBD7;
    --neutral-300: #BEB9B2;
    --neutral-400: #9E978E;
    --neutral-500: #837B70;
    --neutral-600: #6B655C;
    --neutral-800: #43403B;
    --neutral-900: #302E2A;

    /* primary do tenant Pump */
    --primary-50: #FEF3EE;
    --primary-500: #E2622A;
    --primary-600: #C4531F;
    --primary-700: #A34317;

    /* semânticos — a única camada que o componente toca */
    --bg-primary: var(--neutral-0);
    --bg-secondary: var(--neutral-50);
    --bg-tertiary: var(--neutral-100);
    --bg-subtle: var(--neutral-25);
    --bg-brand-default: var(--primary-500);
    --bg-brand-hover: var(--primary-600);
    --bg-brand-active: var(--primary-700);
    --bg-disabled: var(--neutral-100);
    --fg-primary: var(--neutral-800);
    --fg-secondary: var(--neutral-600);
    --fg-tertiary: var(--neutral-500);
    --fg-brand-default: var(--primary-500);
    --fg-brand-on-primary: #FFFFFF;
    --fg-error-accent: #A81208;
    --border-default: var(--neutral-200);
    --border-subtle: var(--neutral-100);
    --border-strong: var(--neutral-300);
    --border-brand-default: var(--primary-500);
    --border-destructive: #D01B0F;

    --radius-md: 8px;
    --radius-lg: 12px;
    --height-sm: 32px;
    --height-md: 40px;
    --height-lg: 48px;
    --label-sm: 12px;
    --label-md: 14px;
    --weight-semibold: 600;
    --focus-brand: 0 0 0 3px rgba(226, 98, 42, 0.25);
    --focus-destructive: 0 0 0 3px rgba(208, 27, 15, 0.25);
    --transition-fast: 120ms cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--fg-primary);
    -webkit-font-smoothing: antialiased;
  }
  @keyframes pump-spin { to { transform: rotate(360deg); } }
  #root { padding: 28px 28px 40px; }

  /* ── header ── */
  .hd { padding-bottom: 26px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 26px; }
  .hd-meta {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
  }
  .hd-meta::before { content: ""; width: 20px; height: 1px; background: var(--border-strong); }
  .hd-title { font-size: 30px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; margin: 12px 0 0; }
  .hd-lede { font-size: 14px; line-height: 1.5; color: var(--fg-secondary); max-width: 620px; margin: 10px 0 0; }

  /* ── section ── */
  .sec { margin-bottom: 34px; }
  .sec:last-child { margin-bottom: 0; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .sec-num { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--fg-tertiary); letter-spacing: 0.08em; }
  .sec-h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sec-note { font-size: 12px; color: var(--fg-tertiary); margin: 0 0 15px; }

  /* ── anatomia ── */
  .an-frame {
    border: 1.5px dashed var(--border-default); border-radius: var(--radius-lg);
    padding: 34px 26px 26px; background: var(--bg-subtle);
  }
  .an-stage { display: flex; justify-content: center; margin-bottom: 30px; }
  .an-dot {
    width: 17px; height: 17px; border-radius: 50%; flex: none;
    background: var(--fg-primary); color: var(--bg-primary);
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .an-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .an-card {
    background: var(--bg-primary); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md); padding: 14px 14px 17px;
  }
  .an-card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .an-card-head strong { font-size: 12px; }
  .an-card p { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--fg-secondary); }

  /* ── playground ── */
  .pg { display: grid; grid-template-columns: 1fr 232px; gap: 14px; }
  .pg-canvas {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    background: var(--bg-subtle);
    min-height: 178px; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(var(--neutral-200) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .pg-panel {
    border: 1px solid var(--border-default); border-radius: var(--radius-lg);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .pg-title {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
  }
  .ctrl { display: flex; flex-direction: column; gap: 5px; }
  .ctrl-label { font-size: 11px; font-weight: 500; color: var(--fg-secondary); }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button {
    padding: 4px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    background: var(--bg-primary); font-family: var(--font-sans); font-size: 11px;
    color: var(--fg-secondary); cursor: pointer; transition: var(--transition-fast);
  }
  .seg button:hover { border-color: var(--fg-tertiary); color: var(--fg-primary); }
  .seg button[aria-pressed="true"] {
    background: var(--fg-primary); border-color: var(--fg-primary); color: var(--bg-primary);
  }
  .ctrl input[type="text"] {
    padding: 6px 8px; border: 1px solid var(--border-default); border-radius: 6px;
    font-family: var(--font-sans); font-size: 12px; color: var(--fg-primary);
    background: var(--bg-primary); outline: none; width: 100%;
  }
  .ctrl input[type="text"]:focus { border-color: var(--fg-primary); }

  .code {
    margin-top: 12px; padding: 13px 15px; border-radius: var(--radius-md);
    background: var(--neutral-900); color: #E8E4DF;
    font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65;
    white-space: pre; overflow-x: auto;
  }
  .code .a { color: #F0A87C; }
  .code .v { color: #9FD1A0; }
  .code .t { color: #A9A29A; }

  /* ── matriz ── */
  .mx-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.mx { border-collapse: collapse; width: 100%; min-width: 480px; }
  table.mx th, table.mx td {
    padding: 13px 15px; text-align: left; border-bottom: 1px solid var(--border-subtle);
  }
  table.mx tr:last-child td { border-bottom: 0; }
  table.mx th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.mx td:first-child {
    font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); white-space: nowrap;
  }

  /* ── tabelas de dados ── */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  table.tbl { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 12px; }
  table.tbl th, table.tbl td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl th {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
    background: var(--bg-secondary);
  }
  table.tbl code { font-family: var(--font-mono); font-size: 11px; color: var(--fg-primary); }
  table.tbl td:last-child { color: var(--fg-secondary); }

  /* ── do / dont ── */
  .dd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dd-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px 16px; }
  .dd-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
    font-family: var(--font-mono); font-size: 9px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .dd-do .dd-head { color: #2E7D50; }
  .dd-dont .dd-head { color: #A81208; }
  .dd-mark { width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .dd-do .dd-mark { background: #E4F2E8; }
  .dd-dont .dd-mark { background: #FBE9E7; }
  .dd-card ul { margin: 0; padding-left: 17px; }
  .dd-card li { font-size: 12px; line-height: 1.5; color: var(--fg-secondary); margin: 4px 0; }

  .a11y { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 15px 17px; }
  .a11y ul { margin: 0; padding-left: 17px; }
  .a11y li { font-size: 12.5px; line-height: 1.55; color: var(--fg-secondary); margin: 5px 0; }
  .a11y b { color: var(--fg-primary); }
  code.i { font-family: var(--font-mono); font-size: 11px; background: var(--bg-secondary); padding: 1px 4px; border-radius: 3px; }

  @media (max-width: 720px) {
    #root { padding: 22px 18px 32px; }
    .pg, .dd, .an-cards { grid-template-columns: 1fr; }
    .hd-title { font-size: 25px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
  const { useState } = React;

  const Spinner = ({ size = 16, color = "currentColor" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ animation: "pump-spin 0.8s linear infinite", flexShrink: 0 }}>
      <circle cx="12" cy="12" r="9" fill="none" stroke={color} strokeWidth="3" strokeDasharray="40 60" strokeLinecap="round" opacity="0.9" />
    </svg>
  );
  const PlusIcon = ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" style={{ flexShrink: 0 }}><path d="M12 5v14M5 12h14" /></svg>
  );
  const ArrowIcon = ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  );

  // ═══════════════════════════════════════════════════════════
  // Button — tone × appearance. Todo valor visual vem de token.
  // ═══════════════════════════════════════════════════════════
  function Button({ tone = "brand", appearance = "primary", size = "sm", icon = "none", state = "default", children = "Save changes" }) {
    const height = size === "lg" ? "var(--height-lg)" : size === "md" ? "var(--height-md)" : "var(--height-sm)";
    const iconPx = size === "lg" ? 24 : size === "md" ? 20 : 16;
    const fontSize = size === "sm" ? "var(--label-sm)" : "var(--label-md)";

    // padding assimétrico quando há ícone líder; simétrico sem ícone
    const PAD = { sm: [12, 16, 12], md: [12, 20, 12], lg: [16, 24, 16] }[size];
    const [padLead, padTrail, padSym] = PAD;
    const paddingLeft = icon === "leading" ? padLead : icon === "trailing" ? padTrail : padSym;
    const paddingRight = icon === "trailing" ? padLead : icon === "leading" ? padTrail : padSym;

    const V = (() => {
      const fB = "var(--focus-brand)", fD = "var(--focus-destructive)";
      if (appearance === "primary") {
        if (tone === "brand") return { bg: "var(--bg-brand-default)", bgHover: "var(--bg-brand-hover)", bgActive: "var(--bg-brand-active)", color: "var(--fg-brand-on-primary)", border: "transparent", focus: fB };
        if (tone === "destructive") return { bg: "#B80008", bgHover: "#B80008", bgActive: "#8C0000", color: "#FAFAF9", border: "transparent", focus: fD };
        if (tone === "neutral") return { bg: "var(--bg-primary)", bgHover: "var(--bg-secondary)", bgActive: "var(--bg-tertiary)", color: "var(--fg-secondary)", border: "var(--border-subtle)", focus: fB };
        return { bg: "var(--fg-primary)", bgHover: "var(--fg-secondary)", bgActive: "var(--fg-tertiary)", color: "var(--bg-primary)", border: "transparent", focus: fB };
      }
      if (appearance === "secondary") {
        if (tone === "brand") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-brand-default)", colorHover: "var(--bg-brand-hover)", colorActive: "var(--bg-brand-active)", border: "var(--border-brand-default)", borderHover: "var(--bg-brand-hover)", borderActive: "var(--bg-brand-active)", focus: fB };
        if (tone === "destructive") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-error-accent)", colorHover: "#B80008", colorActive: "#8C0000", border: "var(--border-destructive)", borderHover: "#B80008", borderActive: "#8C0000", focus: fD };
        return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-secondary)", border: "var(--border-default)", focus: fB };
      }
      if (tone === "brand") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-brand-default)", colorHover: "var(--bg-brand-hover)", colorActive: "var(--bg-brand-active)", border: "transparent", focus: fB };
      if (tone === "destructive") return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-error-accent)", colorHover: "#B80008", colorActive: "#8C0000", border: "transparent", focus: fD };
      return { bg: "transparent", bgHover: "transparent", bgActive: "transparent", color: "var(--fg-secondary)", border: "transparent", focus: fB };
    })();

    const [hover, setHover] = useState(false);
    const [pressed, setPressed] = useState(false);
    const isHover = state === "hover" || hover;
    const isActive = state === "active" || pressed;
    const isFocus = state === "focus";
    const isDisabled = state === "disabled";
    const isLoading = state === "loading";

    // disabled usa tokens próprios, não truque de opacity
    const bg = isDisabled ? "var(--bg-disabled)" : isActive ? V.bgActive : isHover ? V.bgHover : V.bg;
    const color = isDisabled ? "var(--fg-tertiary)"
      : isActive && V.colorActive ? V.colorActive
      : isHover && V.colorHover ? V.colorHover : V.color;
    const border = isDisabled ? "var(--border-subtle)"
      : isActive && V.borderActive ? V.borderActive
      : isHover && V.borderHover ? V.borderHover : V.border;

    return (
      <button
        disabled={isDisabled || isLoading}
        aria-busy={isLoading || undefined}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => { setHover(false); setPressed(false); }}
        onMouseDown={() => setPressed(true)}
        onMouseUp={() => setPressed(false)}
        style={{
          height, paddingLeft, paddingRight, paddingTop: 0, paddingBottom: 0,
          background: bg, color, border: `1px solid ${border}`,
          borderRadius: "var(--radius-md)",
          fontFamily: "var(--font-sans)", fontSize,
          fontWeight: "var(--weight-semibold)", letterSpacing: "-0.005em",
          display: "inline-flex", alignItems: "center", gap: 8,
          cursor: isDisabled || isLoading ? "not-allowed" : "pointer",
          boxShadow: isFocus ? V.focus : "none", outline: "none",
          transition: "var(--transition-fast)", whiteSpace: "nowrap",
        }}>
        {!isLoading && icon === "leading" && <PlusIcon size={iconPx} />}
        {/* no loading o label permanece visível, só esmaecido: preserva o contexto de qual ação está pendente */}
        <span style={{ opacity: isLoading ? 0.7 : 1 }}>{children}</span>
        {isLoading && <Spinner size={iconPx} color={color} />}
        {!isLoading && icon === "trailing" && <ArrowIcon size={iconPx} />}
      </button>
    );
  }

  // ═══════════════════════════════════════════════════════════
  const Section = ({ num, title, note, children }) => (
    <section className="sec">
      <div className="sec-head">
        <span className="sec-num">{num}</span>
        <h2 className="sec-h2">{title}</h2>
      </div>
      {note && <p className="sec-note">{note}</p>}
      {children}
    </section>
  );
  const Seg = ({ value, options, onChange, label }) => (
    <div className="ctrl">
      <span className="ctrl-label">{label}</span>
      <div className="seg">
        {options.map(o => (
          <button key={o} aria-pressed={value === o} onClick={() => onChange(o)}>{o}</button>
        ))}
      </div>
    </div>
  );
  const Dot = ({ n }) => <span className="an-dot">{n}</span>;

  const TONES = ["brand", "neutral", "destructive", "inverse"];
  const APPEARANCES = ["primary", "secondary", "tertiary"];

  function App() {
    const [tone, setTone] = useState("brand");
    const [appearance, setAppearance] = useState("primary");
    const [size, setSize] = useState("md");
    const [icon, setIcon] = useState("leading");
    const [state, setState] = useState("default");
    const [label, setLabel] = useState("Save changes");

    return (
      <>
        <header className="hd">
          <div className="hd-meta"><span>v1.0</span><span>·</span><span>Action / 01</span></div>
          <h1 className="hd-title">Button</h1>
          <p className="hd-lede">
            Uma ação clara, com peso visual proporcional à intenção. Tudo que o usuário
            pode disparar começa aqui.
          </p>
        </header>

        <Section num="01" title="Anatomia" note="Três slots: dois opcionais e um obrigatório.">
          <div className="an-frame">
            <div className="an-stage">
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
                <div style={{ display: "flex", gap: 54, marginBottom: 2 }}><Dot n={3} /><Dot n={3} /></div>
                <div style={{
                  height: 36, paddingLeft: 12, paddingRight: 16,
                  background: "var(--bg-brand-default)", borderRadius: "var(--radius-md)",
                  display: "inline-flex", alignItems: "center", gap: 8, color: "#fff",
                  outline: "1.5px dashed rgba(255,255,255,0.55)", outlineOffset: 2,
                }}>
                  <PlusIcon size={14} />
                  <span style={{ fontSize: 13, fontWeight: 600, fontStyle: "italic" }}>{"{Label}"}</span>
                  <ArrowIcon size={14} />
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                  <span style={{ width: 1, height: 13, background: "var(--border-strong)" }} />
                  <Dot n={2} />
                </div>
              </div>
            </div>
            <div className="an-cards">
              {[
                { n: 1, title: "Container", body: "A forma do botão: altura, raio, fundo e borda — todos vindos de token." },
                { n: 2, title: "Label", body: "O texto que comunica a ação. Verbo no infinitivo ou imperativo, sempre presente." },
                { n: 3, title: "Ícones", body: "Opcionais, antes ou depois do texto. 16px em sm, 20 em md, 24 em lg." },
              ].map(c => (
                <div className="an-card" key={c.n}>
                  <div className="an-card-head"><Dot n={c.n} /><strong>{c.title}</strong></div>
                  <p>{c.body}</p>
                </div>
              ))}
            </div>
          </div>
        </Section>

        <Section num="02" title="Playground" note="Manipule as props ao vivo. O snippet acompanha.">
          <div className="pg">
            <div className="pg-canvas">
              <Button tone={tone} appearance={appearance} size={size} icon={icon} state={state}>{label}</Button>
            </div>
            <div className="pg-panel">
              <span className="pg-title">Props</span>
              <Seg label="tone" value={tone} options={TONES} onChange={setTone} />
              <Seg label="appearance" value={appearance} options={APPEARANCES} onChange={setAppearance} />
              <Seg label="size" value={size} options={["sm", "md", "lg"]} onChange={setSize} />
              <Seg label="icon" value={icon} options={["none", "leading", "trailing"]} onChange={setIcon} />
              <Seg label="state" value={state} options={["default", "hover", "active", "focus", "disabled", "loading"]} onChange={setState} />
              <div className="ctrl">
                <span className="ctrl-label">label</span>
                <input type="text" value={label} onChange={e => setLabel(e.target.value)} aria-label="Texto do botão" />
              </div>
            </div>
          </div>
          <div className="code">
{`<`}<span className="t">Button</span>{`\n  `}<span className="a">tone</span>{`=`}<span className="v">"{tone}"</span>{`\n  `}<span className="a">appearance</span>{`=`}<span className="v">"{appearance}"</span>{`\n  `}<span className="a">size</span>{`=`}<span className="v">"{size}"</span>{`\n  `}<span className="a">icon</span>{`=`}<span className="v">"{icon}"</span>{`\n>\n  ${label}\n</`}<span className="t">Button</span>{`>`}
          </div>
        </Section>

        <Section num="03" title="Variantes" note="Quatro tons por três aparências. A hierarquia é a mesma em todos os tons — e o que ainda não existe fica marcado, não escondido.">
          <div className="mx-wrap">
            <table className="mx">
              <thead>
                <tr>
                  <th>tone \ appearance</th>
                  {APPEARANCES.map(a => <th key={a}>{a}</th>)}
                </tr>
              </thead>
              <tbody>
                {TONES.map(tn => (
                  <tr key={tn}>
                    <td>{tn}</td>
                    {APPEARANCES.map(ap => {
                      // inverse só define primary: secondary/tertiary caem no ramo neutral,
                      // cujo texto escuro dá 1.79:1 sobre superfície escura. Lacuna conhecida,
                      // documentada em vez de disfarçada.
                      const gap = tn === "inverse" && ap !== "primary";
                      return (
                        <td key={ap} style={tn === "inverse" ? { background: "var(--fg-primary)" } : undefined}>
                          {gap ? (
                            <span style={{
                              fontFamily: "var(--font-mono)", fontSize: 10,
                              letterSpacing: "0.06em", textTransform: "uppercase",
                              color: "var(--neutral-400)", border: "1px dashed var(--neutral-600)",
                              borderRadius: 999, padding: "3px 9px", whiteSpace: "nowrap",
                            }}>a definir</span>
                          ) : (
                            <Button tone={tn} appearance={ap} size="sm" icon="none">
                              {tn === "destructive" ? "Delete" : "Button"}
                            </Button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Section>

        <Section num="04" title="Estados" note="Seis estados. Disabled e loading têm tokens próprios, não opacity.">
          <div className="mx-wrap">
            <table className="mx">
              <thead><tr><th>estado</th><th>brand primary</th><th>o que muda</th></tr></thead>
              <tbody>
                {[
                  ["default", "Repouso: fundo no step 500 da marca."],
                  ["hover", "Fundo escurece um step, para 600."],
                  ["active", "Escurece outro step, para 700."],
                  ["focus", "Anel de 3px a 25% de opacidade — nunca remove o indicador."],
                  ["disabled", "Fundo e texto trocam para tokens de disabled; cursor not-allowed."],
                  ["loading", "Spinner entra à direita e o label fica a 70%, preservando o contexto."],
                ].map(([st, desc]) => (
                  <tr key={st}>
                    <td>{st}</td>
                    <td><Button tone="brand" appearance="primary" size="sm" state={st} icon="none">Save</Button></td>
                    <td style={{ fontSize: 12, color: "var(--fg-secondary)" }}>{desc}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Section>


        <Section num="05" title="Uso">
          <div className="dd">
            <div className="dd-card dd-do">
              <div className="dd-head">
                <span className="dd-mark"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#2E7D50" strokeWidth="3.5" strokeLinecap="round"><path d="M20 6 9 17l-5-5" /></svg></span>
                Faça
              </div>
              <ul>
                <li>Ação principal de uma página ou bloco.</li>
                <li>Ação secundária com menos ênfase, em <code className="i">tone="neutral"</code>.</li>
                <li>Ação destrutiva irreversível, em <code className="i">tone="destructive"</code>.</li>
              </ul>
            </div>
            <div className="dd-card dd-dont">
              <div className="dd-head">
                <span className="dd-mark"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#A81208" strokeWidth="3.5" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg></span>
                Não faça
              </div>
              <ul>
                <li>Navegar entre páginas — isso é <b>Link</b>.</li>
                <li>Botão só com ícone — isso é <b>IconButton</b>.</li>
                <li>Ação flutuante única — isso é <b>FAB</b>.</li>
              </ul>
            </div>
          </div>
        </Section>

        <Section num="06" title="Acessibilidade">
          <div className="a11y">
            <ul>
              <li><b>Alvo mínimo</b> de 44px em toque: <code className="i">sm</code> tem 32px de altura visual e precisa de área extra ao redor.</li>
              <li><b>Foco sempre visível</b> — o anel nunca é removido, e não depende só de cor: ele acompanha a borda.</li>
              <li><b>Loading</b> anuncia com <code className="i">aria-busy</code> e mantém o label, para o leitor de tela não perder o contexto da ação.</li>
              <li><b>Disabled</b> usa tokens de fundo e texto próprios em vez de opacity, para o contraste continuar previsível.</li>
              <li><b>Texto sobre fill</b> vem da escala do próprio papel, escolhido pela luminância do fundo — nunca branco fixo.</li>
            </ul>
          </div>
        </Section>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
